<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="100%" height="100%">
  <defs>
    <linearGradient id="embNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145388" />
      <stop offset="100%" stop-color="#0D3B62" />
    </linearGradient>
    <linearGradient id="embTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#008C7D" />
      <stop offset="50%" stop-color="#00A896" />
      <stop offset="100%" stop-color="#02C39A" />
    </linearGradient>
    <filter id="embShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#0A1D33" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#embShadow)">
    <!-- Desk Upper Shelf -->
    <polygon points="45,46 98,46 84,68 31,68" fill="url(#embNavy)" />
    <polygon points="31,68 47,68 61,46 45,46" fill="#0D3B62" opacity="0.85" />
    <rect x="44" y="70" width="46" height="20" rx="2" fill="url(#embNavy)" />
    <polygon points="86,70 90,70 90,88 86,88" fill="#0D3B62" />
    <polygon points="62,75 80,75 80,82 62,82" fill="#00A896" opacity="0.9" />

    <!-- Left Outer Arm of 'V' -->
    <path d="M 52,90 L 82,148 L 102,148 L 74,90 Z" fill="url(#embNavy)" />

    <!-- Bottom Apex of 'V' - Outer Navy Arm -->
    <path d="M 77,136 L 98,168 L 126,168 L 148,124 L 132,124 L 116,152 L 95,152 L 81,126 Z" fill="url(#embNavy)" />

    <!-- Inner Rising Dynamic Teal Zig-zag Arrow -->
    <path d="M 103,148 L 128,98 L 142,108 L 160,54 L 144,54 L 134,88 L 122,80 L 92,148 Z" fill="url(#embTeal)" />
    <polygon points="160,34 140,58 174,54" fill="url(#embTeal)" />
    <polygon points="144,54 160,54 136,128 122,128" fill="url(#embTeal)" />
  </g>
</svg>
